# wanjuan/dsh.bundle.patch.yml
# ⚠️ 当前为：M1/M2 影子观测版。请确保宿主原生压缩（compaction-basic）保持开启！
# 若要切换为正式接管版，请将 auto 改为 false，并手动导出 inject 列表。

- id: wanjuan-native
  name: wanjuan/dsh.mjs # 修正：对齐真实的 src/dsh.mjs
  config:
    dir: ".wanjuan" 

# 注意：宿主的 inject 列表必须完整导出后再追加。
# 在当前影子阶段，请不要强行覆盖 inject，让万卷静默旁观。
# 若宿主支持追加策略，请确保 wanjuanCompactionPolicy 模块确实存在。
# - id: preset-standard
#   inject: [<宿主全量...>, wanjuanCompactionPolicy]